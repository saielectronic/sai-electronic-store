<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>साई इलेक्ट्रॉनिक - फैजपूर</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { background: #003366; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        .product { background: white; padding: 15px; margin: 15px auto; max-width: 300px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; }
        .product img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
        .whatsapp { background: #25d366; color: white; padding: 10px; text-decoration: none; display: block; text-align: center; border-radius: 4px; margin-top: 10px; font-weight: bold; }
        .delete { background: red; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>⚡ साई इलेक्ट्रॉनिक</h1>
    <p>फैजपूर, महाराष्ट्र</p>
    <button onclick="adminLogin()" style="width: auto; padding: 5px 15px; margin-bottom: 20px;">🔒 ॲडमिन लॉगिन</button>

    <!-- Admin Panel -->
    <div id="adminPanel" class="box" style="display:none;">
        <h3>नवीन प्रॉडक्ट जोडा</h3>
        <input type="text" id="pName" placeholder="प्रॉडक्टचे नाव / मॉडेल (उदा. फ्रिज ३५०L)">
        <input type="text" id="pPrice" placeholder="किंमत व ऑफर (उदा. ₹३२,०००)">
        <input type="text" id="pImg" placeholder="फोटोची थेट लिंक (ImgBB Link)">
        <textarea id="pDesc" placeholder="तपशील: Litre, Kg, Warranty, Offer..."></textarea>
        <button onclick="addProduct()">प्रॉडक्ट सेव्ह करा</button>
        <button onclick="changePassword()" style="background: orange; margin-top: 10px;">पासवर्ड बदला</button>
        <button onclick="adminLogout()" style="background: #d9534f; margin-top: 10px;">लॉगआउट</button>
    </div>

    <h2>आमची उत्पादने</h2>
    <div id="productList"></div>

    <script>
        const WHATSAPP_NUMBER = "919975312904"; // तुमचा नंबर हवा असल्यास बदलू शकता

        function getPass() {
            return localStorage.getItem("sai_pass") || "1234";
        }

        let isAdmin = false;

        const defaultItems = [
            { id: 1, name: "रॉकवेल डिस्प्ले फ्रिज", price: "₹३४,०००", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=500", desc: "Capacity: 350 Litre\nWarranty: 5 Years" }
        ];

        function getItems() {
            let data = localStorage.getItem("sai_items");
            return data ? JSON.parse(data) : defaultItems;
        }

        function render() {
            let list = document.getElementById("productList");
            list.innerHTML = "";
            let items = getItems();

            items.forEach(item => {
                let msg = `नमस्कार साई इलेक्ट्रॉनिक, मला ही वस्तू हवी आहे:%0a*प्रॉडक्ट:* ${item.name}%0a*किंमत:* ${item.price}`;
                let div = document.createElement("div");
                div.className = "product";
                div.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <p style="color:red; font-weight:bold;">${item.price}</p>
                    <p style="white-space: pre-line; font-size:13px;">${item.desc}</p>
                    <a class="whatsapp" href="https://wa.me/${WHATSAPP_NUMBER}?text=${msg}" target="_blank">💬 WhatsApp वर ऑर्डर</a>
                    ${isAdmin ? `<button class="delete" onclick="deleteItem(${item.id})">डिलिट करा</button>` : ''}
                `;
                list.appendChild(div);
            });
        }

        function adminLogin() {
            let p = prompt("पासवर्ड टाका (डिफॉल्ट: 1234):");
            if (p === getPass()) {
                isAdmin = true;
                document.getElementById("adminPanel").style.display = "block";
                render();
                alert("यशस्वी लॉगिन!");
            } else if (p !== null) {
                alert("चुकीचा पासवर्ड!");
            }
        }

        function adminLogout() {
            isAdmin = false;
            document.getElementById("adminPanel").style.display = "none";
            render();
        }

        function changePassword() {
            let oldP = prompt("जुना पासवर्ड टाका:");
            if (oldP === getPass()) {
                let newP = prompt("नवीन पासवर्ड टाका:");
                if (newP) {
                    localStorage.setItem("sai_pass", newP);
                    alert("पासवर्ड बदलला!");
                }
            } else if (oldP !== null) {
                alert("चुकाचा पासवर्ड!");
            }
        }

        function addProduct() {
            let name = document.getElementById("pName").value;
            let price = document.getElementById("pPrice").value;
            let img = document.getElementById("pImg").value;
            let desc = document.getElementById("pDesc").value;

            if(!name || !price || !img) {
                alert("कृपया सर्व माहिती भरा!");
                return;
            }

            let items = getItems();
            items.push({ id: Date.now(), name, price, img, desc });
            localStorage.setItem("sai_items", JSON.stringify(items));
            
            document.getElementById("pName").value = "";
            document.getElementById("pPrice").value = "";
            document.getElementById("pImg").value = "";
            document.getElementById("pDesc").value = "";
            render();
            alert("प्रॉडक्ट यशस्वी जोडले गेले!");
        }

        function deleteItem(id) {
            if(confirm("डिलिट करायचे आहे का?")) {
                let items = getItems().filter(i => i.id !== id);
                localStorage.setItem("sai_items", JSON.stringify(items));
                render();
            }
        }

        render();
    </script>
</body>
</html>
