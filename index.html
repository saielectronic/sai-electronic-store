<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>साई इलेक्ट्रॉनिक - फैजपूर</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background: #003366; color: white; padding: 20px; text-align: center; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { font-size: 24px; margin-bottom: 5px; }
        header p { font-size: 14px; color: #ffcc00; }
        .store-badge { margin-top: 10px; font-size: 13px; background: rgba(255,255,255,0.1); display: inline-block; padding: 5px 10px; border-radius: 4px; }
        
        .admin-login-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .admin-login-btn:hover { background: rgba(255,255,255,0.4); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .container h2 { font-size: 22px; color: #003366; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 20px; }

        /* Admin Panel Form (Hidden by default) */
        .admin-panel { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 2px solid #003366; display: none; }
        .admin-panel h3 { margin-bottom: 15px; color: #003366; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-submit { background: #003366; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; }
        .btn-submit:hover { background: #002244; }
        .btn-logout { background: #d9534f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
        .product-img { width: 100%; height: 200px; object-fit: cover; background-color: #e1e1e1; }
        .product-info { padding: 15px; }
        .product-title { font-size: 18px; font-weight: 600; color: #222; margin-bottom: 8px; }
        .product-price { font-size: 18px; color: #b12704; font-weight: bold; margin-bottom: 10px; }
        .product-desc { font-size: 13px; color: #555; line-height: 1.4; margin-bottom: 15px; }

        .card-actions { padding: 15px; background: #fafafa; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 8px; }
        .whatsapp-btn { background-color: #25d366; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .whatsapp-btn:hover { background-color: #1ebe5d; }
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 13px; display: none; font-weight: bold; }
        .delete-btn:hover { background: #e03131; }

        footer { background: #222; color: #aaa; text-align: center; padding: 20px; margin-top: 40px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-bolt"></i> साई इलेक्ट्रॉनिक</h1>
        <p>फैजपूर, महाराष्ट्र | दुकानदाराकडून थेट खरेदी करा</p>
        <div class="store-badge">
            <span><i class="fa-solid fa-store"></i> दुकानात येऊन खरेदी उपलब्ध</span>
        </div>
        <button class="admin-login-btn" onclick="toggleAdminLogin()"><i class="fa-solid fa-lock"></i> ॲडमिन</button>
    </header>

    <main class="container">
        <!-- Admin Panel Form (Password Protected) -->
