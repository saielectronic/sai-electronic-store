<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>साई इलेक्ट्रॉनिक - फैजपूर</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background: #003366; color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { font-size: 24px; margin-bottom: 5px; }
        header p { font-size: 14px; color: #ffcc00; }
        .store-badge { margin-top: 10px; font-size: 13px; background: rgba(255,255,255,0.1); display: inline-block; padding: 5px 10px; border-radius: 4px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .container h2 { font-size: 22px; color: #003366; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
        .product-img { width: 100%; height: 200px; object-fit: cover; background-color: #e1e1e1; }
        .product-info { padding: 15px; }
        .product-title { font-size: 18px; font-weight: 600; color: #222; margin-bottom: 8px; }
        .product-price { font-size: 18px; color: #b12704; font-weight: bold; margin-bottom: 10px; }
        .product-desc { font-size: 13px; color: #555; line-height: 1.4; margin-bottom: 15px; }
        .features-list { font-size: 12px; color: #444; margin-bottom: 15px; padding-left: 15px; }
        .features-list li { margin-bottom: 3px; }
        .card-actions { padding: 15px; background: #fafafa; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
        .whatsapp-btn { background-color: #25d366; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .whatsapp-btn:hover { background-color: #1ebe5d; }
        .store-info-text { font-size: 11px; color: #777; text-align: center; }
        footer { background: #222; color: #aaa; text-align: center; padding: 20px; margin-top: 40px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <h1><i class="fa-solid fa-bolt"></i> साई इलेक्ट्रॉनिक</h1>
            <p>फैजपूर, महाराष्ट्र | दुकानदाराकडून थेट खरेदी करा</p>
        </div>
        <div class="store-badge">
            <span><i class="fa-solid fa-store"></i> दुकानात येऊन खरेदी उपलब्ध</span>
        </div>
    </header>

    <main class="container">
        <h2>आमची इलेक्ट्रॉनिक उत्पादने</h2>
        <p class="subtitle">वस्तू निवडा, तपशील तपासा आणि थेट WhatsApp वर बुक करा!</p>

        <div class="product-grid" id="productGrid"></div>
    </main>

    <footer>
        <p>&copy; 2026 साई इलेक्ट्रॉनिक, फैजपूर. सर्व हक्क सुरक्षित.</p>
        <p>पत्ता: राजकमल कलेक्शन्स जवळ, फैजपूर.</p>
    </footer>

    <script>
        // तुमचा व्हॉट्सॲप नंबर इथे टाका (उदा. 919822345678)
        const WHATSAPP_NUMBER = "919822345678"; 

        const products = [
            {
                id: 1,
                name: "सैमसंग ४३ इंच स्मार्ट एलईडी टीव्ही",
                price: "₹२८,५००",
                image: "https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=500&q=80",
                desc: "क्रिस्टल ४के युएचडी डिस्प्ले, स्पष्ट आवाज आणि वाय-फाय कनेक्टिव्हिटी.",
                features: ["४३ इंच स्क्रीन", "१ वर्षाची वॉरंटी", "स्मार्ट फीचर्स उपलब्ध"]
            },
            {
                id: 2,
                name: "रॉकवेल कमर्शियल डिस्प्ले फ्रिज",
                price: "₹३४,०००",
                image: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=500&q=80",
                desc: "दुकानांसाठी किंवा कोल्ड ड्रिंक्ससाठी उत्तम कूलिंग क्षमता असलेला डिस्प्ले फ्रिज.",
                features: ["डबल ग्लास दरवाजा", "वीज बचत करणारा कॉम्प्रेसर", "दुकानदारांसाठी बेस्ट"]
            },
            {
                id: 3,
                name: "व्हर्लपूल सिंगल डोअर रेफ्रिजरेटर",
                price: "₹१७,२००",
                image: "https://images.unsplash.com/photo-1571175372374-41c8c43f721d?auto=format&fit=crop&w=500&q=80",
                desc: "पावर कट झाल्यावरही दीर्घकाळ कुलिंग टिकवून ठेवणारी टेक्नॉलॉजी.",
                features: ["५ स्टार रेटिंग", "स्टेबिलायझर फ्री ऑपरेशन", "आकर्षक डिझाईन"]
            },
            {
                id: 4,
                name: "लॉइड १.५ टन इन्व्हर्टर एसी",
                price: "₹३५,०००",
                image: "https://images.unsplash.com/photo-1615874959474-d609969a20ed?auto=format&fit=crop&w=500&q=80",
                desc: "झटपट थंड करणारा आणि कमी वीज वापरणारा एसी.",
                features: ["१.५ टन क्षमता", "कॉपर कंडेन्सर", "लो नॉइज ऑपरेशन"]
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("productGrid");
            
            products.forEach(product => {
                let featuresHtml = product.features.map(f => `<li>${f}</li>`).join('');
                
                let whatsappMessage = `नमस्कार साई इलेक्ट्रॉनिक,%0a%0aमला खालील वस्तू बद्दल माहिती हवी आहे / बुक करायची आहे:%0a*प्रॉडक्ट:* ${product.name}%0a*किंमत:* ${product.price}%0a%0aमी ती दुकानावर येऊन घेणार आहे. कृपया पुढील माहिती द्या.`;
                
                let whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${whatsappMessage}`;

                let card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <div>
                        <img src="${product.image}" alt="${product.name}" class="product-img">
                        <div class="product-info">
                            <h3 class="product-title">${product.name}</h3>
                            <div class="product-price">${product.price}</div>
                            <p class="product-desc">${product.desc}</p>
                            <ul class="features-list">
                                ${featuresHtml}
                            </ul>
                        </div>
                    </div>
                    <div class="card-actions">
                        <a href="${whatsappLink}" target="_blank" class="whatsapp-btn">
                            <i class="fa-brands fa-whatsapp"></i> WhatsApp वर ऑर्डर करा
                        </a>
                        <span class="store-info-text"><i class="fa-solid fa-location-dot"></i> दुकानावरून थेट घेऊन जा</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
